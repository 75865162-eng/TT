name: Build Wimoor Java+MySQL Stack

# 拉代码后自动编译 4 个后端 jar + 构建前端 dist，打包成可下载产物。
# 触发：push 到 java-only / main、手动触发、PR。
on:
  push:
    branches: [java-only, main]
  pull_request:
    branches: [java-only, main]
  workflow_dispatch:

jobs:
  build-backend:
    name: 编译 4 个 Java 后端 (JDK 11)
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: 安装私有 jar 到本地仓库
        working-directory: wimoor/wimoor-erp/erp-boot
        run: |
          # 这两个 jar 不在 Maven 中央仓库，pom 的 install-plugin 绑在 clean 阶段，
          # 这里显式安装，确保干净 runner 上也能解析依赖。
          mvn -B -q install:install-file \
            -Dfile=src/main/resources/lib/ocean.client.java.biz.jar \
            -DgroupId=com.biz -DartifactId=biz -Dversion=1.0 -Dpackaging=jar
          mvn -B -q install:install-file \
            -Dfile=src/main/resources/lib/aop-sdk-message-0.9.0.jar \
            -DgroupId=alibaba.message -DartifactId=alibaba.message -Dversion=0.9.0 -Dpackaging=jar
          echo "私有 jar 安装完成"

      - name: 编译全部模块（含 4 个目标服务，跳过测试）
        working-directory: wimoor
        run: |
          mvn -B -pl wimoor-gateway,wimoor-admin/admin-boot,wimoor-erp/erp-boot,wimoor-ai -am \
            -DskipTests -Dmaven.test.skip=true -Djava.version=11 package

      - name: 汇总 jar 产物
        run: |
          mkdir -p artifacts/jars
          cp wimoor/wimoor-gateway/target/*.jar artifacts/jars/ 2>/dev/null || true
          cp wimoor/wimoor-admin/admin-boot/target/*.jar artifacts/jars/ 2>/dev/null || true
          cp wimoor/wimoor-erp/erp-boot/target/*.jar artifacts/jars/ 2>/dev/null || true
          cp wimoor/wimoor-ai/target/wimoor-ai-*.jar artifacts/jars/ 2>/dev/null || true
          # 去掉 original- 前缀的辅助 jar
          find artifacts/jars -name 'original-*' -delete
          echo "=== jar 清单 ==="
          ls -lh artifacts/jars/

      - name: 上传 jar 产物
        uses: actions/upload-artifact@v4
        with:
          name: wimoor-jars
          path: artifacts/jars/*.jar
          retention-days: 14

  build-frontend:
    name: 构建 Vue 前端 dist
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖并构建
        working-directory: wimoor/wimoor-ui
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: 打包 dist
        run: |
          mkdir -p artifacts
          cd wimoor/wimoor-ui
          tar -czf ../../artifacts/wimoor-ui-dist.tar.gz dist
          ls -lh ../../artifacts/wimoor-ui-dist.tar.gz

      - name: 上传前端产物
        uses: actions/upload-artifact@v4
        with:
          name: wimoor-ui-dist
          path: artifacts/wimoor-ui-dist.tar.gz
          retention-days: 14

  package-release:
    name: 合并为一键部署包
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: 检出部署脚本
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            deploy
            docs
            scripts
          sparse-checkout-cone-mode: false

      - name: 下载 jar 产物
        uses: actions/download-artifact@v4
        with:
          name: wimoor-jars
          path: bundle/jars

      - name: 下载前端产物
        uses: actions/download-artifact@v4
        with:
          name: wimoor-ui-dist
          path: bundle

      - name: 解包前端并组装部署包
        run: |
          tar -xzf bundle/wimoor-ui-dist.tar.gz -C bundle
          rm -f bundle/wimoor-ui-dist.tar.gz
          mkdir -p bundle/html
          cp -a bundle/dist/. bundle/html/
          rm -rf bundle/dist
          cp -a deploy bundle/deploy
          cp -a docs bundle/docs
          cp -a scripts bundle/scripts
          echo "=== 部署包结构 ==="
          find bundle -maxdepth 2 -type d | sort
          echo "=== jar 清单 ==="
          ls -lh bundle/jars/

      - name: 上传一键部署包
        uses: actions/upload-artifact@v4
        with:
          name: wimoor-deploy-bundle
          path: bundle/
          retention-days: 14
