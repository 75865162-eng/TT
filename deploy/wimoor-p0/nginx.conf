# HTTP (80)：保持原行为不变，不做强制跳转（避免影响当前可用的 HTTP 访问与证书续期验证）
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 前端静态资源 + history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 兼容前端部分模块使用 /api 前缀的写法（finance、菜单路由等）。
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://host.docker.internal:8099;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        client_max_body_size 100m;
    }

    # 所有后端 API 走网关（网关按前缀转发到各服务）
    location ~ ^/(admin|erp|amazon|amazonadv|quote|chelsea|temu|mdata|finance|plantool|code)/api {
        proxy_pass http://host.docker.internal:8099;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        client_max_body_size 100m;
    }

    # AI 能力模块（wimoor-ai:8110）：直接转发到该服务
    location /ai/api {
        proxy_pass http://host.docker.internal:8110;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        client_max_body_size 50m;
    }

    location /actuator {
        proxy_pass http://host.docker.internal:8099;
    }
}

# HTTPS (443)：Let's Encrypt 证书，源站直接对外提供 HTTPS（灰云 DNS Only 模式使用）
server {
    listen 443 ssl;
    http2 on;
    server_name esmorah.com www.esmorah.com;

    ssl_certificate     /etc/letsencrypt/certs/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://host.docker.internal:8099;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        client_max_body_size 100m;
    }

    location ~ ^/(admin|erp|amazon|amazonadv|quote|chelsea|temu|mdata|finance|plantool|code)/api {
        proxy_pass http://host.docker.internal:8099;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        client_max_body_size 100m;
    }

    location /ai/api {
        proxy_pass http://host.docker.internal:8110;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        client_max_body_size 50m;
    }

    location /actuator {
        proxy_pass http://host.docker.internal:8099;
    }
}
