server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 前端静态资源 + history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 兼容前端部分模块使用 /api 前缀的写法（finance、菜单路由等）。
    # 去掉 /api 前缀后转给网关，等价于开发期 Vite 的 rewrite 规则。
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://host.docker.internal:8099;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        client_max_body_size 100m;
    }

    # 所有后端 API 走网关（网关按前缀转发到各服务）
    location ~ ^/(admin|erp|amazon|amazonadv|quote|chelsea|temu|mdata|finance|plantool|code)/api {
        proxy_pass http://host.docker.internal:8099;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        client_max_body_size 100m;
    }

    # AI 能力模块（wimoor-ai:8102）：直接转发到该服务
    location /ai/api {
        proxy_pass http://host.docker.internal:8102;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        client_max_body_size 50m;
    }

    # 网关自身端口探测等
    location /actuator {
        proxy_pass http://host.docker.internal:8099;
    }
}
